name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Air-Music-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Air-Music-Android
          path: Air-Music-Android.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-build-${{ github.run_number }}"
          Air-Music-Android.apk
          --target "${{ github.sha }}"
          --title "Air Music Android — build ${{ github.run_number }}"
          --notes "APK Android instalável, assinado para desenvolvimento. Android 8 ou superior. Precisa de internet para carregar o modelo de visão. Código-fonte e instruções em android/."
          --prerelease
