name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'app.js', 'engine.js', 'guitar.js', 'index.html', 'tests/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test gesture mapping and guitar synthesis
        run: node --test tests/*.test.mjs
      - name: Sync Android app assets
        run: node scripts/sync-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Air-Music-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Air-Music-Android
          path: Air-Music-Android.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-build-${{ github.run_number }}"
          Air-Music-Android.apk
          --target "${{ github.sha }}"
          --title "Air Music Android — build ${{ github.run_number }}"
          --notes "Air Music 1.2.2: trava preservada ao pausar câmera, trocar modo e espelho; guitarra fixa após posicionar, sem deslocamento ao tocar, trocar o formato dos dedos ou perder uma mão na câmera. Reposicione somente pelo botão. APK de teste para Android 8 ou superior. Remova a versão de teste anterior se o Android recusar a atualização por assinatura. Precisa de internet para carregar o reconhecimento das mãos. Código e instruções em android/."
          --prerelease
